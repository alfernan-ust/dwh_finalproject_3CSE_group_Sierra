id: shopzada_main_etl_pipeline
namespace: shopzada.team
description: "End-to-end data warehouse pipeline for ShopZada, performing parallel extraction and sequential loading based on foreign key dependencies."

tasks:
  - id: Extract
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: BusinessDept
        type: io.kestra.plugin.scripts.python.Commands
        beforeCommands:
          - pip install pandas openpyxl pyarrow
          - export PYTHONPATH=$PYTHONPATH:/opt/kestra/workspace
        namespaceFiles:
          enabled: true
          include:
            - dataframe.py
            - business.py
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        outputFiles:
          - "product_list.parquet"
        commands:
          - python /opt/kestra/workspace/business.py

      - id: CustomerManagementDept
        type: io.kestra.plugin.scripts.python.Commands
        beforeCommands:
          - pip install pandas pyarrow
          - export PYTHONPATH=$PYTHONPATH:/opt/kestra/workspace
        namespaceFiles:
          enabled: true
          include:
            - dataframe.py
            - customer_management.py
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        outputFiles:
          - credit_card.parquet
          - user_data.parquet
          - user_job.parquet
        commands:
          - python /opt/kestra/workspace/customer_management.py

      - id: EnterpriseDepartment
        type: io.kestra.plugin.scripts.python.Commands
        beforeCommands:
          - pip install pandas pyarrow bs4 lxml html5lib
          - export PYTHONPATH=$PYTHONPATH:/opt/kestra/workspace
        namespaceFiles:
          enabled: true
          include:
            - dataframe.py
            - enterprise.py
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        outputFiles:
          - merchant_data.parquet
          - order_merchant_data.parquet
          - staff_data.parquet
        commands:
          - python /opt/kestra/workspace/enterprise.py

      - id: MarketingDepartment
        type: io.kestra.plugin.scripts.python.Commands
        beforeCommands:
          - pip install pandas pyarrow bs4 lxml html5lib
          - export PYTHONPATH=$PYTHONPATH:/opt/kestra/workspace
        namespaceFiles:
          enabled: true
          include:
            - dataframe.py
            - marketing.py
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        outputFiles:
          - campaign_data.parquet
          - transactional_campaign_data.parquet
        commands:
          - python /opt/kestra/workspace/marketing.py

      - id: OperationsDepartment
        type: io.kestra.plugin.scripts.python.Commands
        beforeCommands:
          - pip install pandas bs4 lxml html5lib openpyxl pyarrow
          - export PYTHONPATH=$PYTHONPATH:/opt/kestra/workspace
        namespaceFiles:
          enabled: true
          include:
            - dataframe.py
            - operations.py
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        outputFiles:
          - order_product_list.parquet
          - output_order_data.parquet
          - order_delays.parquet
          - order_cost.parquet
        commands:
          - python /opt/kestra/workspace/operations.py
          

  - id: LoadDimensions
    type: io.kestra.plugin.core.flow.Sequential
    tasks:
      - id: LoadDateDim
        type: io.kestra.plugin.scripts.python.Commands
        beforeCommands:
          - pip install pandas pyarrow psycopg2-binary
        namespaceFiles:
          enabled: true
          include:
            - /opt/kestra/workspace/load_dim_date.py
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        commands:
          - python /opt/kestra/workspace/load_dim_date.py
      
      - id: LoadOtherDimensionsParallel
        type: io.kestra.plugin.core.flow.Parallel
        tasks:
          - id: LoadProductDim
            type: io.kestra.plugin.scripts.python.Commands
            beforeCommands:
              - pip install pandas pyarrow psycopg2-binary
            namespaceFiles:
              enabled: true
              include:
                - /opt/kestra/workspace/load_dim_product.py
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            commands:
              - python /opt/kestra/workspace/load_dim_product.py

          - id: LoadCustomerDim
            type: io.kestra.plugin.scripts.python.Commands
            beforeCommands:
              - pip install pandas pyarrow psycopg2-binary
            namespaceFiles:
              enabled: true
              include:
                - /opt/kestra/workspace/load_dim_customer.py
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            commands:
              - python /opt/kestra/workspace/load_dim_customer.py

          - id: LoadMerchantDim
            type: io.kestra.plugin.scripts.python.Commands
            beforeCommands:
              - pip install pandas pyarrow psycopg2-binary
            namespaceFiles:
              enabled: true
              include:
                - /opt/kestra/workspace/load_dim_merchant.py
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            commands:
              - python /opt/kestra/workspace/load_dim_merchant.py

          - id: LoadStaffDim
            type: io.kestra.plugin.scripts.python.Commands
            beforeCommands:
              - pip install pandas pyarrow psycopg2-binary
            namespaceFiles:
              enabled: true
              include:
                - /opt/kestra/workspace/load_dim_staff.py
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            commands:
              - python /opt/kestra/workspace/load_dim_staff.py

          - id: LoadCampaignDim
            type: io.kestra.plugin.scripts.python.Commands
            beforeCommands:
              - pip install pandas pyarrow psycopg2-binary
            namespaceFiles:
              enabled: true
              include:
                - /opt/kestra/workspace/load_dim_campaign.py
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            commands:
              - python /opt/kestra/workspace/load_dim_campaign.py
          
  - id: LoadFacts
    type: io.kestra.plugin.core.flow.Sequential
    tasks:
      - id: LoadFactOrders
        type: io.kestra.plugin.scripts.python.Commands
        beforeCommands:
          - pip install pandas pyarrow psycopg2-binary
        namespaceFiles:
          enabled: true
          include:
            - /opt/kestra/workspace/load_fact_orders.py
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        commands:
          - python /opt/kestra/workspace/load_fact_orders.py

      - id: LoadFactDetailsParallel
        type: io.kestra.plugin.core.flow.Parallel
        tasks:
          - id: LoadFactCampaignTransactions
            type: io.kestra.plugin.scripts.python.Commands
            beforeCommands:
              - pip install pandas pyarrow psycopg2-binary
            namespaceFiles:
              enabled: true
              include:
                - /opt/kestra/workspace/load_fact_campaign_transactions.py
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            commands:
              - python /opt/kestra/workspace/load_fact_campaign_transactions.py

          - id: LoadFactLineItems
            type: io.kestra.plugin.scripts.python.Commands
            beforeCommands:
              - pip install pandas pyarrow psycopg2-binary
            namespaceFiles:
              enabled: true
              include:
                - /opt/kestra/workspace/load_fact_line_items.py
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            commands:
              - python /opt/kestra/workspace/load_fact_line_items.py