id: shopzada_main_etl_pipeline
namespace: shopzada.team
description: "Shopzada ETL with explicit Extract, Transform, and Load orchestration"

tasks:
  - id: CreateTables
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    beforeCommands:
      - pip install psycopg2-binary
    commands:
      - python /opt/kestra/workspace/initiate_tables.py

  - id: Extract
    type: io.kestra.plugin.core.flow.Parallel
    tasks:

      - id: ExtractBusiness
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas openpyxl pyarrow
          - export PYTHONPATH=/opt/kestra/workspace
        commands:
          - python /opt/kestra/workspace/extract/extract_business.py

      - id: ExtractCustomerManagement
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow
          - export PYTHONPATH=/opt/kestra/workspace
        commands:
          - python /opt/kestra/workspace/extract/extract_customer_management.py

      - id: ExtractEnterprise
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow bs4 lxml html5lib
          - export PYTHONPATH=/opt/kestra/workspace
        commands:
          - python /opt/kestra/workspace/extract/extract_enterprise.py

      - id: ExtractMarketing
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow bs4 lxml html5lib
          - export PYTHONPATH=/opt/kestra/workspace
        commands:
          - python /opt/kestra/workspace/extract/extract_marketing.py

      - id: ExtractOperations
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas bs4 lxml html5lib openpyxl pyarrow
          - export PYTHONPATH=/opt/kestra/workspace
        commands:
          - python /opt/kestra/workspace/extract/extract_operations.py



  - id: TransformPreprocessing
    type: io.kestra.plugin.core.flow.Parallel
    tasks:

      - id: TransformOperations
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow
        commands:
          - python /opt/kestra/workspace/transform/transform_operations.py

      - id: TransformMarketing
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow
        commands:
          - python /opt/kestra/workspace/transform/transform_marketing.py

      - id: TransformEnterprise
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow
        commands:
          - python /opt/kestra/workspace/transform/transform_enterprise.py

      - id: TransformCustomerManagement
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow
        commands:
          - python /opt/kestra/workspace/transform/transform_customer_management.py

      - id: TransformBusiness
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow
        commands:
          - python /opt/kestra/workspace/transform/transform_business.py


  - id: TransformDimensions
    type: io.kestra.plugin.core.flow.Parallel
    tasks:

      - id: TransformDimDate
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow
        commands:
          - python /opt/kestra/workspace/transform/dim_date.py

      - id: TransformDimCustomer
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow
        commands:
          - python /opt/kestra/workspace/transform/dim_customer.py

      - id: TransformDimProduct
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow
        commands:
          - python /opt/kestra/workspace/transform/dim_product.py

      - id: TransformDimMerchant
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow
        commands:
          - python /opt/kestra/workspace/transform/dim_merchant.py

      - id: TransformDimStaff
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow
        commands:
          - python /opt/kestra/workspace/transform/dim_staff.py

      - id: TransformDimCampaign
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow
        commands:
          - python /opt/kestra/workspace/transform/dim_campaign.py

 

  - id: TransformFacts
    type: io.kestra.plugin.core.flow.Sequential
    tasks:

      - id: TransformFactOrders
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow
        commands:
          - python /opt/kestra/workspace/transform/fact_orders.py

      - id: TransformFactLineItems
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow
        commands:
          - python /opt/kestra/workspace/transform/fact_line_items.py

      - id: TransformFactCampaignTransactions
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow
        commands:
          - python /opt/kestra/workspace/transform/fact_campaign_transactions.py

  

  - id: LoadDimensions
    type: io.kestra.plugin.core.flow.Parallel
    tasks:

      - id: LoadDimDate
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow psycopg2-binary
        commands:
          - python /opt/kestra/workspace/load/load_dim_date.py

      - id: LoadDimCustomer
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow psycopg2-binary
        commands:
          - python /opt/kestra/workspace/load/load_dim_customer.py

      - id: LoadDimProduct
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow psycopg2-binary
        commands:
          - python /opt/kestra/workspace/load/load_dim_product.py

      - id: LoadDimMerchant
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow psycopg2-binary
        commands:
          - python /opt/kestra/workspace/load/load_dim_merchant.py

      - id: LoadDimStaff
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow psycopg2-binary
        commands:
          - python /opt/kestra/workspace/load/load_dim_staff.py

      - id: LoadDimCampaign
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow psycopg2-binary
        commands:
          - python /opt/kestra/workspace/load/load_dim_campaign.py


  - id: LoadFacts
    type: io.kestra.plugin.core.flow.Sequential
    tasks:

      - id: LoadFactOrders
        type: io.kestra.plugin.scripts.python.Commands
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        beforeCommands:
          - pip install pandas pyarrow psycopg2-binary
        commands:
          - python /opt/kestra/workspace/load/load_fact_orders.py

      - id: LoadFactDetails
        type: io.kestra.plugin.core.flow.Parallel
        tasks:

          - id: LoadFactLineItems
            type: io.kestra.plugin.scripts.python.Commands
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            beforeCommands:
              - pip install pandas pyarrow psycopg2-binary
            commands:
              - python /opt/kestra/workspace/load/load_fact_line_items.py

          - id: LoadFactCampaignTransactions
            type: io.kestra.plugin.scripts.python.Commands
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            beforeCommands:
              - pip install pandas pyarrow psycopg2-binary
            commands:
              - python /opt/kestra/workspace/load/load_fact_campaign_transactions.py
